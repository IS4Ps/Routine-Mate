# 5. Swagger API 문서 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

# 6. JWT 암호화 및 토큰 만료 설정
jwt:
  secret: ${JWT_SECRET}
  access-expiration: 43200000    # 12시간 (1000ms * 60 * 60 * 12)
  refresh-expiration: 1209600000 # 14일 (1000ms * 60 * 60 * 24 * 14)

openai: ${OPENAI_API_KEY}

# Firebase 서비스 계정 키 파일 경로
firebase:
  service-account-path: classpath:firebase-service-account.json

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace

