spring:
  application:
    name: adhd
  profiles:
    active: local   # TODO: 배포 전 반드시 이 줄 삭제!

  # 1. MySQL 연결 설정 (AWS EC2)
  datasource:
    url: jdbc:mysql://100.27.204.252:3306/capstone?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
#    url: jdbc:mysql://localhost:3306/adhd_local?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 2. JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    # defer-datasource-initialization: true

  # 3. 초기 데이터 설정 (data.sql 실행 옵션)
  sql:
    init:
    # mode: always

