spring:
  application:
    name: adhd

  # 1. MySQL \uC5F0\uACB0 \uC124\uC815 (AWS EC2)
  datasource:
    url: jdbc:mysql://100.27.204.252:3306/capstone?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 2. JPA \uC124\uC815
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    # defer-datasource-initialization: true

  # 3. \uCD08\uAE30 \uB370\uC774\uD130 \uC124\uC815 (data.sql \uC2E4\uD589 \uC635\uC158)
  sql:
    init:
    # mode: always

  # 4. \u2B50\uFE0F OAuth2 \uD074\uB77C\uC774\uC5B8\uD2B8(\uAD6C\uAE00, \uCE74\uCE74\uC624) \uC811\uC18D \uC124\uC815 (\uC2E0\uADDC \uCD94\uAC00) \u2B50\uFE0F
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:${GOOGLE_CLIENT_ID}}
            client-secret: ${GOOGLE_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET}}
            scope:
              - email
              - profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID:temp-kakao-id}
            client-secret: ${KAKAO_CLIENT_SECRET:temp-kakao-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            client-name: Kakao
        # \uCE74\uCE74\uC624\uB294 \uC2A4\uD504\uB9C1 \uAE30\uBCF8 \uB0B4\uC7A5\uC774 \uC544\uB2C8\uB77C\uC11C \uD1B5\uC2E0\uD560 \uC8FC\uC18C\uB97C \uC9C1\uC811 \uBA85\uC2DC
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# 5. Swagger API \uBB38\uC11C \uC124\uC815
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

# 6. JWT \uC554\uD638\uD654 \uBC0F \uD1A0\uD070 \uB9CC\uB8CC \uC124\uC815
jwt:
  secret: 12345678901234567890123456789012
  access-expiration: 3600000    # 1\uC2DC\uAC04 (1000ms * 60 * 60)
  refresh-expiration: 1209600000 # 14\uC77C (1000ms * 60 * 60 * 24 * 14)